}

body {

.flores {

}

.f1 { top: 5%; left: 5%; }
.f2 { top: 12%; right: 7%; animation-delay: 1s; }
.f3 { bottom: 8%; left: 8%; animation-delay: 2s; }
.f4 { bottom: 12%; right: 8%; animation-delay: 1.5s; }

@keyframes flotar {
    50% { transform: translateY(-15px) rotate(10deg); }
}

.contenedor {
    width: 100%;
    max-width: 520px;
    background: #fff7f2;
    padding: 30px 22px;
    border-radius: 18px 18px 30px 30px;
    text-align: center;
    position: relative;
    box-shadow: 0 15px 40px #a83b5940;
    border: 2px solid #e9a4b5;
}

.contenedor::before {
    content: "♡  ♡  ♡  ♡  ♡";
    display: block;
    color: #df7795;
    font-size: 23px;

    margin-bottom: 15px;
}

h1 {
    color: #a83257;
    font-size: 31px;
    margin: 10px 0;
}

.subtitulo {
    color: #bd6680;
    font-size: 17px;
    font-style: italic;
}

.sobre {
    margin: 25px auto;
    font-size: 75px;
    animation: latido 2s infinite;
}

@keyframes latido {
    50% { transform: scale(1.08); }
}

.carta {
    background: linear-gradient(145deg, #fff0f3, #ffe1e8);
    border: 2px dashed #e98aa5;
    border-radius: 18px;
    padding: 25px 15px;
    margin: 15px 0;
    min-height: 175px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#mensaje {
    color: #9e3455;
    font-size: 23px;
    line-height: 1.6;
    transition: opacity .3s;
}

button {
    border: none;
    border-radius: 30px;
    padding: 15px 25px;
    background: linear-gradient(135deg, #e94e7b, #bd174f);
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 5px 12px #b8325b55;
    transition: transform .2s;
}

button:hover {
    transform: scale(1.06);
}

.pie {
    color: #c05c7b;
    font-size: 17px;
    font-style: italic;
    margin-top: 25px;
}

.contador {
    color: #bd6680;
    font-size: 12px;
    margin-top: 15px;
}

.corazon {
    position: fixed;
    bottom: -30px;
    animation: subir 6s linear forwards;
    pointer-events: none;
}

@keyframes subir {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width: 400px) {
    h1 { font-size: 25px; }
    #mensaje { font-size: 20px; }
    .contenedor { padding: 25px 15px; }
}

const elemento = document.getElementById("mensaje");
const contador = document.getElementById("contador");

let anterior = sessionStorage.getItem("ultimoMensaje");
let actual;

function nuevoMensaje() {

    let numero;

    do {
        numero = Math.floor(Math.random() * mensajes.length);
    } while (mensajes.length > 1 && numero == anterior);

    actual = numero;
    anterior = numero;

    sessionStorage.setItem("ultimoMensaje", numero);

    elemento.style.opacity = 0;

    setTimeout(() => {
        elemento.textContent = mensajes[numero];
        elemento.style.opacity = 1;

        contador.textContent =
            "Mensajito " + (numero + 1) + " de " + mensajes.length;
    }, 250);

    crearCorazon();
}

// =================================
// CORAZONES FLOTANTES

function crearCorazon() {

    const corazon = document.createElement("div");

    corazon.className = "corazon";

    const simbolos = ["❤️", "💕", "💗", "💖", "🌸"];

    corazon.textContent =
        simbolos[Math.floor(Math.random() * simbolos.length)];

    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.fontSize = (15 + Math.random() * 20) + "px";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 6000);
}
